[project]
name = "morning-advisor"
version = "0.1.0"
description = "朝の財務・健康アドバイザー: マネーフォワードとHuawei Healthのデータを取得し、計画値との差分をAIがアドバイス"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "anthropic>=0.40",
    "pyyaml>=6.0",
    "schedule>=1.2",
    "pydantic>=2.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[project.scripts]
morning-advisor = "app.main:main"

[tool.ruff]
target-version = "py311"
line-length = 100
